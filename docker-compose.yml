version: '3.8'

services:
  # 1. The OpenWrt Edge Router (with LuCI Web UI)
  sdn_router:
    image: openwrtorg/rootfs:x86-64
    container_name: sdn_router
    command: /sbin/init
    privileged: true
    cap_add:
      - NET_ADMIN
    ports:
      - "8080:80"   # Access LuCI Web UI via http://localhost:8080
    volumes:
      - ./setup_router.sh:/setup_router.sh
    networks:
      wan_network:
        ipv4_address: 172.20.0.2  # Public IP
      lan_network:
        ipv4_address: 10.0.0.1    # Internal Gateway IP

  # 2. Protected Web Server
  web_server:
    image: nginx:alpine
    container_name: web_server
    networks:
      lan_network:
        ipv4_address: 10.0.0.100
    depends_on:
      - sdn_router

  # 3. Protected Lightweight App Server
  api_server:
    image: python:alpine
    container_name: api_server
    command: sh -c "echo 'API Running' > index.html && python -m http.server 3000"
    networks:
      lan_network:
        ipv4_address: 10.0.0.101
    depends_on:
      - sdn_router

  # 4. The Attacker / External Client
  external_client:
    image: alpine:latest
    container_name: external_client
    cap_add:
      - NET_ADMIN
    # Add a static route so the attacker knows how to reach the LAN through the router
    command: sh -c "ip route add 10.0.0.0/24 via 172.20.0.2 && tail -f /dev/null"
    networks:
      wan_network:
        ipv4_address: 172.20.0.10

networks:
  wan_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  lan_network:
    driver: bridge
    internal: true # STRICT ISOLATION: No outside access allowed directly
    ipam:
      config:
        - subnet: 10.0.0.0/24