<!DOCTYPE html>
<html>
<head>
    <title>Digital Twin - Live Topology</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.23.0/cytoscape.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f4f9; }
        #cy { width: 800px; height: 500px; border: 1px solid #ccc; margin: 20px auto; background-color: white; border-radius: 8px;}
        .status { font-size: 1.2em; font-weight: bold; margin-top: 10px; }
        .attack-alert { color: #e74c3c; animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <h2>🚀 RL Agent Live Routing Policy</h2>

    <div id="statusText" class="status">Waiting for telemetry...</div>
    <div class="status" style="font-size: 1em; font-weight: normal;">
        Volume: <span id="live-volume">0 Bytes</span> | Latency: <span id="live-latency">0 ms</span>
    </div>
    <div class="status" style="font-size: 1.1em; font-weight: bold; margin-bottom: 10px;">
        AI Action: <span id="ai-decision">Analyzing...</span>
    </div>
    <div id="cy"></div>

    <script>
        // Initialize Cytoscape Network Graph
        var cy = cytoscape({
            container: document.getElementById('cy'),
            // --- NEW ENTERPRISE TOPOLOGY ---
            elements: [
                // Nodes
                { data: { id: 'Attacker', label: 'External Client\n(172.20.0.10)' }, classes: 'node-external' },
                { data: { id: 'Edge', label: 'Edge Firewall\n(OpenWrt)' }, classes: 'node-firewall' },
                { data: { id: 'Core', label: 'Core Switch\n(OVS)' }, classes: 'node-switch' },
                { data: { id: 'Admin', label: 'Admin Server\n(10.0.10.100)' }, classes: 'node-server' },
                { data: { id: 'Guest', label: 'Guest API\n(10.0.20.101)' }, classes: 'node-server' },

                // Edges (Physical Links)
                { data: { id: 'Link-WAN', source: 'Attacker', target: 'Edge' } },
                { data: { id: 'Link-Transit', source: 'Edge', target: 'Core' } },
                { data: { id: 'Link-Admin', source: 'Core', target: 'Admin' } },
                { data: { id: 'Link-Guest', source: 'Core', target: 'Guest' } }
            ],
            style: [
                {
                    selector: 'node',
                    style: {
                        'background-color': '#3498db',
                        'label': 'data(label)',
                        'color': '#fff',
                        'text-valign': 'center',
                        'text-outline-width': 2,
                        'text-outline-color': '#3498db',
                        'font-size': '14px'
                    }
                },
                {
                    selector: 'edge',
                    style: {
                        'width': 6,
                        'line-color': '#ccc',
                        'target-arrow-color': '#ccc',
                        'target-arrow-shape': 'triangle',
                        'curve-style': 'bezier'
                    }
                },
                // Dynamic styles managed by WebSocket
                {
                    selector: '.active-allowed',
                    style: { 'background-color': '#2ecc71', 'line-color': '#2ecc71', 'target-arrow-color': '#2ecc71', 'width': 8 }
                },
                {
                    selector: '.active-blocked',
                    style: { 'background-color': '#ff3333', 'line-color': '#ff3333', 'target-arrow-color': '#ff3333', 'width': 8 }
                }
            ],
            layout: {
                name: 'breadthfirst',
                directed: true,
                padding: 10,
                spacingFactor: 1.5
            }
        });

        // Connect to FastAPI WebSocket
        const ws = new WebSocket("ws://localhost:8000/ws/live_topology");
        const statusEl = document.getElementById('statusText');

        // --- REAL-TIME AI ANIMATION LOGIC ---
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);

            // Update Dashboard Metrics
            document.getElementById('live-volume').innerText = data.volume + " Bytes";
            document.getElementById('live-latency').innerText = data.lat_a + " ms";

            // Clear previous animation states
            cy.elements().removeClass('active-allowed active-blocked');

            if (data.route === 0) {
                // TRUE NEGATIVE: Normal Traffic Allowed
                document.getElementById('ai-decision').innerText = "Traffic Allowed";
                document.getElementById('ai-decision').style.color = "#00ff00";

                // Light up the backbone in green
                cy.getElementById('Attacker').addClass('active-allowed');
                cy.getElementById('Link-WAN').addClass('active-allowed');
                cy.getElementById('Edge').addClass('active-allowed');
                cy.getElementById('Link-Transit').addClass('active-allowed');
                cy.getElementById('Core').addClass('active-allowed');

            } else if (data.route === 1) {
                // TRUE POSITIVE: Attack Mitigated (IP Blocked)
                document.getElementById('ai-decision').innerText = "IP Blocked (Mitigating)";
                document.getElementById('ai-decision').style.color = "#ff3333";

                // Highlight the blocked perimeter in red; keep internal network safe
                cy.getElementById('Attacker').addClass('active-blocked');
                cy.getElementById('Link-WAN').addClass('active-blocked');
                cy.getElementById('Edge').addClass('active-blocked');

                // Visually sever the connection to the core
                cy.getElementById('Link-Transit').removeClass('active-allowed active-blocked');
                cy.getElementById('Core').removeClass('active-allowed active-blocked');
            }
        };

        ws.onopen = () => { statusEl.innerText = "🟢 Connected to Digital Twin"; };
        ws.onclose = () => { statusEl.innerText = "🔴 Disconnected"; };
    </script>
</body>
</html>
